[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conlang"
version = "0.1.0"
description = "Seeded constructed-language text generation from English"
requires-python = ">=3.10"
dependencies = ["spacy>=3.8,<3.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "vulture>=2.14,<3",
]

[tool.setuptools.packages.find]
include = ["conlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["conlang"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

[tool.vulture]
paths = ["conlang"]
exclude = ["conlang/languages/_template"]
min_confidence = 80

[tool.coverage.run]
source = ["conlang"]
omit = ["conlang/languages/_template/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
