[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conlang"
version = "0.1.0"
description = "Seeded constructed-language text generation from English"
requires-python = ">=3.10"
dependencies = ["spacy>=3.8,<3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["conlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
